[build-system]
requires = [
    "setuptools >= 42",
    "plover[gui_qt] >= 5.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "plover-next-stroke"
version = "0.2.2"
description = "Next Stroke Suggestions GUI Plugin for Plover"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Kaoffie", email = "kaoffie@gmail.com"},
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
keywords = [
    "plover",
    "plover_plugin",
]
dependencies = [
    "plover[gui_qt] >= 5.0.0",
]

[project.urls]
homepage = "https://github.com/Kaoffie/plover_next_stroke"

[project.entry-points."plover.gui.qt.tool"]
    next_stroke = "plover_next_stroke.next_stroke_suggestions:NextStrokeSuggestions"

[project.entry-points."plover.macro"]
    ns_prev_page = "plover_next_stroke.next_stroke_macros:prev_page"
    ns_next_page = "plover_next_stroke.next_stroke_macros:next_page"
    ns_reload = "plover_next_stroke.next_stroke_macros:next_stroke_reload"
